[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hazid"
version = "0.1.2"
description = "Evaluating LLMs as participants in ATM hazard-identification sessions (FHA/PSSA)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Moustapha Amadou Roufaï"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "scikit-learn>=1.3", "openpyxl>=3.1"]

[project.optional-dependencies]
providers = ["anthropic", "openai", "google-genai"]
dev = ["pytest>=7", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
